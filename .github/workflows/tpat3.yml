name: tpat3

on:
  schedule:
    - cron: '0 1 * * *'    # 08:00 Thailand (UTC+7) daily digest
    - cron: '30 1 * * 0'   # Sunday 08:30 Thailand weekly quiz
  workflow_dispatch:
    inputs:
      kind:
        description: digest or quiz
        type: choice
        options: [digest, quiz]
        default: digest

permissions:
  contents: write

concurrency:
  group: tpat3

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIND: ${{ github.event.inputs.kind || (github.event.schedule == '30 1 * * 0' && 'quiz' || 'digest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic markdown
      - name: Generate
        run: python scripts/generate.py "$KIND"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Send email
        run: python scripts/send.py "$KIND"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Commit outputs
        run: |
          git config user.name "tpat3-bot"
          git config user.email "tpat3-bot@users.noreply.github.com"
          git add digests quizzes state
          git diff --cached --quiet || git commit -m "chore: $KIND $(date -u +%F)"
          git push
