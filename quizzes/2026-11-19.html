<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบทดสอบ TPAT3 ข่าวสารและความรู้ 19 พ.ย. 2026</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#5a6578;--line:#cfd6e3;--ok:#1e8e4e;--okbg:#e3f6ea;--bad:#c62828;--badbg:#fde8e8;--pri:#2457c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 4px}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;font-weight:600}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.q h2{font-size:1.05rem;margin:0 0 10px;line-height:1.55}
.tag{display:inline-block;font-size:.78rem;color:var(--pri);background:#e6edfb;border-radius:6px;padding:1px 8px;margin-bottom:6px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f3f7ff}
.opt b{flex:0 0 1.6em}
.opt:disabled{cursor:default;color:var(--text);opacity:1}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f1f3f8;border-left:4px solid var(--pri);font-size:.96rem}
.exp .res{font-weight:700;margin-bottom:4px}
.exp .res.ok{color:var(--ok)}.exp .res.no{color:var(--bad)}
#sum{display:none;background:var(--card);border:2px solid var(--pri);border-radius:12px;padding:18px;text-align:center;margin:18px 0}
#sum .big{font-size:2rem;font-weight:700;color:var(--pri)}
button.restart{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>แบบทดสอบ TPAT3 ข่าวสารและความรู้</h1>
  <div class="sub">ประจำวันที่ 19 พ.ย. 2026 · 10 ข้อ · เลือกคำตอบแล้วล็อกทันที พร้อมเฉลย</div>
  <div class="bar"><span id="count">ตอบแล้ว 0 / 10</span><div class="prog"><i id="pb"></i></div></div>
  <div id="list"></div>
  <div id="sum"></div>
</div>
<script>
const QUESTIONS = [
{tag:"ข่าว: Terra ของ NASA",q:"ก่อนปิดระบบ ดาวเทียม Terra จะใช้เชื้อเพลิงที่เหลือลดวงโคจร (deorbit) เพราะเหตุผลใดที่สัมพันธ์กับหลักการทางฟิสิกส์มากที่สุด",o:["เพื่อประหยัดเชื้อเพลิงที่ต้องใช้คงวงโคจรในช่วงปีสุดท้ายของภารกิจ","เพื่อให้ได้รับรังสีจากดวงอาทิตย์น้อยลงจนเครื่องมือเย็นลงและปลอดภัย","เพราะแรงเสียดทานของอากาศที่หนาแน่นขึ้นทำให้ตกเข้าบรรยากาศเร็วขึ้น","เพราะแรงโน้มถ่วงของโลกที่ใกล้ขึ้นช่วยให้เก็บข้อมูลได้นานกว่าเดิม","เพราะแรงโน้มถ่วงที่ลดลงทำให้โคจรช้าลงจนหยุดนิ่งเหนือจุดเดิมบนโลก"],a:2,e:"ที่ระดับต่ำ อากาศหนาแน่นกว่า แรงเสียดทานของอากาศทำให้ดาวเทียมเสียพลังงานและตกเข้าสู่ชั้นบรรยากาศเร็วขึ้น ไม่ค้างเป็นขยะอวกาศนานหลายสิบปี (ข่าว Terra) การลดวงโคจรต้องใช้เชื้อเพลิง ไม่ได้ประหยัดเชื้อเพลิง"},
{tag:"ข่าว: สวทช. 10 เทคโนโลยีเกิดใหม่",q:"เหตุใดชิปเอไอแบบนิวโรมอร์ฟิก (neuromorphic) ที่เลียนแบบเซลล์ประสาทจึงใช้พลังงานน้อยลง 10-100 เท่าเมื่อเทียบกับระบบเดิม",o:["ทำงานเฉพาะเมื่อมีสัญญาณเข้า จึงไม่เปลืองพลังงานในช่วงที่ไม่มีข้อมูล","ลดความถี่สัญญาณนาฬิกาของทุกส่วนในชิปให้ต่ำลงตลอดเวลาการทำงาน","แยกหน่วยความจำออกจากหน่วยประมวลผลให้ไกลกันเพื่อลดความร้อนสะสม","ใช้แรงดันไฟฟ้าสูงขึ้นเพื่อให้คำนวณเสร็จในเวลาสั้นลงมากเท่านั้น","คำนวณด้วยแสงแทนไฟฟ้า จึงไม่มีการสูญเสียพลังงานเป็นความร้อนเลย"],a:0,e:"ชิปนิวโรมอร์ฟิกเลียนแบบเซลล์ประสาทที่ส่งสัญญาณเฉพาะเมื่อมีสิ่งเร้า (event-driven) ต่างจากระบบเดิมที่ทำงานต่อเนื่องตลอดเวลา จึงประหยัดพลังงาน (โฟโทนิกส์เป็นเทคโนโลยีอีกรายการหนึ่ง ไม่ใช่หลักการของชิปนี้)"},
{tag:"ข่าว: สวทช. 10 เทคโนโลยีเกิดใหม่",q:"คอนกรีตกักเก็บคาร์บอน (carbon-mineralised concrete) ลดคาร์บอนฟุตพรินต์ของคอนกรีตได้ 5-50% ด้วยกลไกใด",o:["ใช้ความร้อนเผาไล่คาร์บอนออกจากวัตถุดิบก่อนผสมเป็นคอนกรีต","ใช้สารเคมีดูดซับ CO2 จากอากาศไว้ที่ผิวนอกของคอนกรีตเท่านั้น","แทนที่ปูนซีเมนต์ด้วยทรายทั้งหมดเพื่อไม่ให้เกิด CO2 ตอนบ่มตัว","ใช้เหล็กเสริมที่มีคาร์บอนต่ำลงเพื่อลดคาร์บอนในโครงสร้างอาคาร","ให้ CO2 ทำปฏิกิริยากับแคลเซียมเป็นแคลเซียมคาร์บอเนตที่เก็บคาร์บอน"],a:4,e:"CO2 ทำปฏิกิริยากับแร่ธาตุแคลเซียมเกิดเป็นแคลเซียมคาร์บอเนต ซึ่งแข็งตัวและกักเก็บคาร์บอนไว้ในเนื้อคอนกรีต จึงลดการปล่อยก๊าซเรือนกระจกจากงานก่อสร้าง"},
{tag:"ข่าว: Terra ของ NASA (โจทย์คำนวณ)",q:"Terra ออกแบบให้ทำงาน 6 ปี แต่ใช้งานจริงราว 27 ปี หมายความว่าใช้งานนานกว่าอายุออกแบบราวกี่เท่า",o:["ราว 3 เท่า","ราว 4.5 เท่า","ราว 21 เท่า","ราว 33 เท่า","ราว 1.5 เท่า"],a:1,e:"27 ÷ 6 = 4.5 เท่า สอดคล้องกับที่ NASA ระบุว่าใช้งานเกิน 4 เท่าของอายุออกแบบ ส่วน 21 มาจากการลบ (27 - 6) และ 33 มาจากการบวก (27 + 6) ซึ่งไม่ใช่การเปรียบเทียบเป็นเท่า"},
{tag:"ข่าว: IEA ยอดขายรถไฟฟ้า",q:"IEA ระบุว่ารถไฟฟ้าช่วยลดการใช้น้ำมันนำเข้าและมลพิษทางอากาศในเมือง สัมพันธ์กับหลักการใดมากที่สุด",o:["แบตเตอรี่ให้พลังงานต่อน้ำหนักสูงกว่าน้ำมัน จึงวิ่งได้ไกลกว่าด้วยพลังงานเท่ากัน","รถไฟฟ้าเบากว่ารถสันดาปเสมอ จึงใช้พลังงานต่อกิโลเมตรน้อยกว่า","รถไฟฟ้าไม่สูญเสียพลังงานตอนชาร์จและขับ จึงมีประสิทธิภาพเท่ากับ 100%","มอเตอร์แปลงไฟฟ้าเป็นพลังงานกลได้ดีกว่าเครื่องยนต์และไม่เผาน้ำมันขณะวิ่ง","ไฟฟ้าที่ใช้ชาร์จมาจากพลังงานน้ำทั้งหมด จึงไม่ก่อมลพิษที่ใดเลย"],a:3,e:"มอเตอร์ไฟฟ้ามีประสิทธิภาพการแปลงพลังงานสูงกว่าเครื่องยนต์สันดาปและไม่เผาน้ำมันขณะวิ่ง จึงลดน้ำมันนำเข้าและมลพิษในเมือง ประโยชน์จะมากขึ้นเมื่อไฟฟ้ามาจากพลังงานสะอาด แต่ไม่มีระบบใดมีประสิทธิภาพ 100%"},
{tag:"ความรู้พื้นฐาน: SMR (อ้างอิงข่าว สวทช.)",q:"ระบบความปลอดภัยแบบพาสซีฟ (passive safety) ของเครื่องปฏิกรณ์ขนาดเล็ก SMR ได้เปรียบระบบที่ต้องใช้ปั๊มไฟฟ้า เพราะเหตุใด",o:["ใช้เชื้อเพลิงปริมาณน้อยจึงไม่มีความร้อนตกค้างหลังหยุดปฏิกิริยา","ใช้แรงโน้มถ่วงและการพาความร้อนระบายความร้อน จึงไม่ต้องพึ่งปั๊มไฟฟ้า","ใช้เครื่องกำเนิดไฟฟ้าสำรองขนาดใหญ่หลายชุดเดินปั๊มอย่างต่อเนื่อง","ใช้ผนังคอนกรีตหนาล้อมรอบเพื่อดูดซับความร้อนทั้งหมดไว้ตลอดไป","ใช้ปั๊มที่ขับด้วยพลังงานแสงอาทิตย์จึงทำงานแม้ไฟฟ้าโครงข่ายดับ"],a:1,e:"ระบบพาสซีฟอาศัยแรงโน้มถ่วงและการพาความร้อนตามธรรมชาติ ไม่พึ่งปั๊มไฟฟ้า จึงยังระบายความร้อนได้เมื่อไฟฟ้าดับ ส่วนเครื่องกำเนิดไฟฟ้าสำรองและปั๊มเป็นระบบแอคทีฟ"},
{tag:"ความรู้พื้นฐาน: หญ้าทะเล (blue carbon)",q:"ข้อใดอธิบายเหตุผลที่หญ้าทะเลเป็นแหล่งกักเก็บ คาร์บอนสีน้ำเงิน (blue carbon) ได้ถูกต้อง",o:["ปล่อยก๊าซมีเทนที่ทำให้น้ำทะเลเย็นลงและดูดความร้อนจากบรรยากาศ","เปลี่ยนน้ำทะเลเป็นน้ำจืดจึงลดการละลายของ CO2 ในมหาสมุทร","ใช้ CO2 ทำปฏิกิริยากับเกลือในน้ำทะเลเป็นหินปูนที่ตกตะกอนถาวร","สะสมคาร์บอนไว้เฉพาะในใบ ซึ่งงอกใหม่ทุกฤดูกาลจึงกักเก็บได้นาน","ดึง CO2 ด้วยการสังเคราะห์แสง แล้วฝังในตะกอนใต้น้ำที่ย่อยสลายช้า"],a:4,e:"หญ้าทะเลดึง CO2 ด้วยการสังเคราะห์ด้วยแสง แล้วคาร์บอนส่วนหนึ่งสะสมในตะกอนใต้น้ำที่ออกซิเจนต่ำและย่อยสลายช้า จึงเก็บได้นาน ไม่ใช่เก็บเฉพาะในใบที่ผลัดทิ้ง"},
{tag:"ความรู้พื้นฐาน: ไฮโดรเจนสีเขียว",q:"ไฮโดรเจนสีเขียว (green hydrogen) ถูกเรียกว่าสะอาดเพราะวิธีผลิตแบบใด",o:["แยกน้ำด้วยไฟฟ้าจากพลังงานหมุนเวียน จึงไม่ปล่อย CO2 ตอนผลิต","ผลิตจากก๊าซธรรมชาติแล้วดักจับ CO2 เก็บไว้ใต้ดินได้ทั้งหมด","ผลิตจากถ่านหินที่กรองฝุ่นและกำมะถันออกแล้วทั้งหมดก่อนใช้","ผลิตจากพืชสีเขียวด้วยการสังเคราะห์ด้วยแสงของใบโดยตรง","ผลิตจากน้ำมันดิบด้วยกระบวนการที่ไม่มีควันและกลิ่นรบกวน"],a:0,e:"สีเขียวหมายถึงวิธีผลิต: แยกน้ำด้วยไฟฟ้า (electrolysis) จากพลังงานหมุนเวียน ไม่ปล่อย CO2 ตอนผลิต ส่วนการผลิตจากก๊าซธรรมชาติแล้วดักจับคาร์บอนเป็นไฮโดรเจนอีกประเภทหนึ่ง และตัวก๊าซเองไม่มีสี"},
{tag:"ความรู้พื้นฐาน: PM2.5",q:"PM2.5 คืออนุภาคที่มีเส้นผ่านศูนย์กลางไม่เกิน 2.5 ไมโครเมตร เหตุใดจึงเป็นอันตรายต่อสุขภาพมากกว่าฝุ่นที่ใหญ่กว่า",o:["มีมวลมากกว่าฝุ่นใหญ่ จึงตกสะสมที่ปอดส่วนล่างได้เร็วกว่า","มีสารพิษเข้มข้นกว่าต่อหน่วยมวลเสมอ จึงทำลายเซลล์ได้มากกว่า","เกิดจากการเผาไหม้เท่านั้น จึงมีสารก่อมะเร็งอยู่ในทุกอนุภาค","เล็กพอจะผ่านการกรองของจมูก ลึกถึงถุงลมและเข้ากระแสเลือดบางส่วน","เล็กมากจนหน้ากากทุกชนิดกรองไม่ได้ จึงเข้าสู่ร่างกายทุกครั้งที่หายใจ"],a:3,e:"ยิ่งอนุภาคเล็ก ยิ่งหลุดการกรองของระบบหายใจส่วนต้นและเข้าถึงถุงลมปอดหรือกระแสเลือดได้ ฝุ่นเล็กมีมวลน้อยกว่า ไม่ใช่มากกว่า และหน้ากากชนิดกรองอนุภาคได้ดี (เช่น N95) ลดการสูดได้มาก"},
{tag:"ความรู้พื้นฐาน: เซลล์แสงอาทิตย์",q:"เซลล์แสงอาทิตย์ (solar cell) ผลิตไฟฟ้าได้อย่างไร",o:["แสงทำให้ความร้อนสูงขึ้นจนโลหะในแผงนำไฟฟ้าได้ จึงเกิดกระแสไฟฟ้า","แสงต้มน้ำในแผงจนเป็นไอไปหมุนกังหันขนาดเล็กที่ต่อกับเครื่องผลิตไฟฟ้า","โฟตอนปลดอิเล็กตรอนในสารกึ่งตัวนำ สนามที่รอยต่อ p-n ผลักให้เกิดกระแส","แสงทำให้อะตอมซิลิคอนแตกตัวเป็นนิวเคลียสที่เบากว่าและปล่อยพลังงาน","แผงเก็บประจุไฟฟ้าสถิตจากอากาศ แล้วแสงทำหน้าที่ปล่อยประจุออกมา"],a:2,e:"ปรากฏการณ์โฟโตโวลตาอิก: โฟตอนให้พลังงานแก่อิเล็กตรอนในสารกึ่งตัวนำ สนามไฟฟ้าที่รอยต่อ p-n ผลักให้เกิดกระแสไฟฟ้าตรง โดยไม่ต้องผ่านการต้มน้ำหรือปฏิกิริยานิวเคลียร์"}
];

const L="ABCDE";
const list=document.getElementById("list"),sum=document.getElementById("sum");
let answered,score;

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function build(){
  answered=0;score=0;sum.style.display="none";
  list.innerHTML="";
  QUESTIONS.forEach((x,i)=>{
    const d=document.createElement("div");d.className="q";
    d.innerHTML='<span class="tag">'+esc(x.tag)+'</span><h2>'+(i+1)+'. '+esc(x.q)+'</h2>'+
      x.o.map((t,j)=>'<button class="opt" data-j="'+j+'"><b>'+L[j]+'.</b><span>'+esc(t)+'</span></button>').join("")+
      '<div class="exp" hidden></div>';
    d.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(d,x,+b.dataset.j)));
    list.appendChild(d);
  });
  upd();
}

function pick(d,x,j){
  const bs=d.querySelectorAll(".opt");
  bs.forEach(b=>b.disabled=true);
  bs[x.a].classList.add("correct");
  const ok=j===x.a;
  if(!ok)bs[j].classList.add("wrong");
  const ex=d.querySelector(".exp");
  ex.hidden=false;
  ex.innerHTML='<div class="res '+(ok?'ok':'no')+'">'+(ok?'ถูกต้อง':'ไม่ถูกต้อง')+' · คำตอบที่ถูกคือ '+L[x.a]+'</div>'+esc(x.e);
  answered++;if(ok)score++;
  upd();
  if(answered===QUESTIONS.length)finish();
}

function upd(){
  document.getElementById("count").textContent="ตอบแล้ว "+answered+" / "+QUESTIONS.length;
  document.getElementById("pb").style.width=(answered/QUESTIONS.length*100)+"%";
}

function finish(){
  const p=Math.round(score/QUESTIONS.length*100);
  sum.innerHTML='<div>สรุปผล</div><div class="big">'+score+' / '+QUESTIONS.length+'</div><div>คิดเป็น '+p+'%</div>'+
    '<button class="restart" id="rs">เริ่มใหม่</button>';
  sum.style.display="block";
  document.getElementById("rs").addEventListener("click",()=>{build();window.scrollTo({top:0,behavior:"smooth"})});
  sum.scrollIntoView({behavior:"smooth",block:"center"});
}

build();
</script>
</body>
</html>
